name: Desktop (Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build API + web
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          cd web && npm ci && npm run build
      - name: Install desktop deps
        working-directory: apps/desktop
        run: |
          npm ci > ../../ci.log 2>&1 || { tail -40 ../../ci.log | sed 's/^/::error::/'; exit 1; }
      - name: Tag the version (release needs an existing tag)
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          git config user.name "github-actions"; git config user.email "actions@github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then git tag "v$V" && git push origin "v$V"; fi
      - name: Build & publish installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/prepare-server.js
          npx electron-builder --win nsis --x64 --publish always > ../../eb.log 2>&1 || { tail -40 ../../eb.log | sed 's/^/::error::/'; exit 1; }
          tail -15 ../../eb.log
